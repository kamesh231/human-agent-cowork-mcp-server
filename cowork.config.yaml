# COWORK Protocol Configuration
# These are opinionated defaults. Override what you disagree with.
# Every default here is a position on how human-agent collaboration should work.

trust:
  # New agents start at low trust. They earn autonomy.
  default_level: 0.3

  # After 20 approved actions (>80% approval rate), auto-promote trust
  auto_promote_after: 20
  auto_promote_threshold: 0.8

  # 3 consecutive overrides = trust demotion
  auto_demote_after: 3

  # Trust decays 1% per day without activity (use it or lose it)
  decay_per_day: 0.01

authority:
  # Agents SUGGEST by default. They never act directly without earning trust.
  default_mode: "suggest"   # suggest | review | act

  # Max actions per hour before automatic pause
  volume_cap: 50

  # Fields that ALWAYS require human approval, regardless of trust level
  high_risk_fields:
    - "deal_stage"
    - "owner"
    - "commission"
    - "utm_*"
    - "billing_*"
    - "password"
    - "permissions"

handoff:
  # Handoffs include structured context, not just transcripts
  context_format: "structured"

  # Agent must explain why it's escalating
  include_reasoning: true

  # Agent must state its confidence level
  include_confidence: true

  # Agent must list what it already tried
  include_attempted: true

  # Max seconds to wait for human response before timeout
  handoff_timeout: 3600

feedback:
  # Humans MUST give a reason when overriding (not just click reject)
  override_requires_reason: true

  # Structured reason categories
  reason_types:
    - "agent_wrong"        # Agent made a factual/logical error
    - "human_preference"   # Agent was technically correct but human prefers different approach
    - "missing_context"    # Agent didn't have enough information
    - "policy_change"      # Rules changed, agent's knowledge is outdated
    - "edge_case"          # Unusual situation agent wasn't designed for

  # Implicit approval: if human doesn't override within this many seconds, treat as approved
  implicit_approval_seconds: 86400  # 24 hours

storage:
  # Default: local JSON file. Zero setup. Inspect with any text editor.
  driver: "json"
  path: "./cowork-data.json"

  # Future options (uncomment to use):
  # driver: "turso"
  # url: "libsql://your-db.turso.io"
  # token: "your-token"

# ─── Agent Identity ──────────────────────────────────────────────────────────
# When this section is non-empty the server enters "closed mode":
# every tool call must include a matching agent_token field.
# Leave commented out (or empty) for open/demo mode.
#
# Generating a token:
#   node -e "const {generateToken, hashToken} = require('./build/auth.js');
#             const t = generateToken(); console.log('token:', t);
#             console.log('hash:', hashToken(t));"
#
# DEV/DEMO MODE (plaintext token in config):
agents:
  - id: "sales-agent"
    token: "sk-cowork-3619387ed0e6fff5aae38f66c2a4e079f4f4e29edf8b883c"

  - id: "support-agent"
    token: "sk-cowork-REPLACE_WITH_GENERATED_TOKEN"

# PRODUCTION MODE (token_hash in config, plaintext in .env):
# Uncomment this section and comment out the above for production
# agents:
#   - id: "sales-agent"
#     token_hash: "d03f462b83c1b6121e9e97662456dc63a57ac1ec676045660591fa1d3e059b11"
#     workspace_id: "acme-corp"
#
#   - id: "support-agent"
#     token_hash: "sha256-hex-of-generated-token"
#     workspace_id: "acme-corp"
#
# Then store plaintext tokens in .env:
# COWORK_SALES_AGENT_TOKEN="sk-cowork-3619387ed0e6fff5aae38f66c2a4e079f4f4e29edf8b883c"
# COWORK_SUPPORT_AGENT_TOKEN="sk-cowork-..."

# ─── Policies ─────────────────────────────────────────────────────────────────
# Named rule sets. Defined ONCE here and referenced by ID in mappings below.
# Two agents can share one policy. One agent can use different policies in
# different domains. Rules are never duplicated.
#
# Constraint types:
#   high_risk    — field always requires human review, regardless of trust
#   readonly     — field cannot be modified at all (hard stop)
#   value_range  — numeric value must fall within min/max
#   enum         — value must be one of the listed options
#   regex        — value must match the pattern
#
policies:
  - id: "crm-write-policy"
    description: "Standard write access for CRM fields"
    rules:
      - field: "deal_stage"
        constraint: "high_risk"          # always requires human review
      - field: "owner"
        constraint: "high_risk"
      - field: "commission"
        constraint: "readonly"
        reason: "Finance team only — use billing workflow instead"
      - field: "amount"
        constraint: "value_range"
        min: 0
        max: 500000
      - field: "utm_*"
        constraint: "readonly"
        reason: "Marketing attribution — never overwrite"

  - id: "support-write-policy"
    description: "Write access for support ticket fields"
    rules:
      - field: "priority"
        constraint: "enum"
        values: ["low", "medium", "high", "critical"]
      - field: "assigned_to"
        constraint: "high_risk"          # escalate before reassigning
      - field: "billing_*"
        constraint: "readonly"
        reason: "Billing fields require finance approval"
      - field: "status"
        constraint: "enum"
        values: ["open", "in_progress", "pending_customer", "resolved", "closed"]

# ─── Mappings ─────────────────────────────────────────────────────────────────
# Explicit three-way join: who × where × which rules.
#
# Rules:
#   • An agent can only operate in domains listed here (no mapping = blocked)
#   • If no mapping exists, the proposal is escalated to a human for permission
#   • One agent can map to multiple domains (different policy per domain)
#   • Multiple agents can reference the same policy_id (shared rule set)
#   • Global authority.high_risk_fields always apply on top of mapped policy rules
#
# Example relationships demonstrated below:
#   sales-agent  + crm.deals      → crm-write-policy  (direct domain match)
#   support-agent + crm.deals     → crm-write-policy  (2 agents → 1 policy)
#   sales-agent  + support.tickets → support-write-policy (1 agent → 2 policies)
#
mappings:
  - agent_id: "sales-agent"
    domain: "crm.deals"
    policy_id: "crm-write-policy"

  - agent_id: "support-agent"
    domain: "support.tickets"
    policy_id: "support-write-policy"

  # Demonstrates: 2 agents sharing 1 policy in the same domain
  - agent_id: "support-agent"
    domain: "crm.deals"
    policy_id: "crm-write-policy"      # support-agent uses the same CRM rules as sales-agent

  # Demonstrates: 1 agent accessing a second domain with a different policy
  - agent_id: "sales-agent"
    domain: "support.tickets"
    policy_id: "support-write-policy"  # sales-agent in support scope gets support rules

sentry:
  # Action Attribution proxy — the "AI Flight Recorder".
  # When enabled, wraps a downstream MCP server and logs every tool call
  # with a tamper-evident audit trail in SQLite.
  enabled: false

  # Path to the SQLite audit database.
  db_path: "./cowork-traces.db"

  # "strict" blocks tool calls without an intent string.
  # "warn" logs a warning but forwards the call anyway.
  enforcement: "strict"

  # Additional sensitive key patterns to redact (on top of built-in patterns).
  # Supports simple globs: "*_secret", "api_*"
  sensitive_keys: []

  # Enable SHA-256 hash chain for tamper detection.
  hash_chain: true
